<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FAFO · Modo Carrera</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; align-items: center; }

    #app {
      width: 100%; max-width: 480px; height: 100vh;
      display: flex; flex-direction: column;
      background: var(--bg);
      border-left: 1px solid var(--border); border-right: 1px solid var(--border);
      position: relative;
    }

    /* ---- top bar ---- */
    .topbar-app {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-bottom: 1px solid var(--border); background: var(--card); flex-shrink: 0;
    }
    .badge {
      width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-size: 24px; font-weight: 900; color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.5); flex-shrink: 0;
    }
    .clubbox { flex: 1; min-width: 0; }
    #clubTitle { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .level-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .level-tag { font-size: 11px; color: var(--muted); font-weight: 700; white-space: nowrap; }
    .xp-bar { flex: 1; height: 6px; background: #0b0f14; border-radius: 3px; overflow: hidden; }
    .xp-fill { display: block; height: 100%; background: var(--accent); transition: width .3s; }
    .currency { font-size: 13px; font-weight: 800; white-space: nowrap; }
    .gear { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }

    /* ---- content ---- */
    #content { flex: 1; overflow-y: auto; padding: 14px; }

    /* ---- bottom nav ---- */
    .navbar { display: flex; border-top: 1px solid var(--border); background: var(--card); flex-shrink: 0; }
    .navbar button {
      flex: 1; background: none; border: none; color: var(--muted); font-size: 11px;
      padding: 8px 0 10px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 2px; font-weight: 700;
    }
    .navbar button .ic { font-size: 20px; line-height: 1; }
    .navbar button.active { color: var(--accent); }

    /* ---- cards ---- */
    .overall-card { text-align: center; padding: 22px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 14px; }
    .big-rating { font-size: 64px; font-weight: 900; line-height: 1; }
    .home-name { font-size: 18px; font-weight: 800; margin-top: 4px; }
    .record { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .match-card { background: var(--card); border: 1px solid var(--accent); border-radius: 14px; padding: 16px; text-align: center; margin-bottom: 14px; }
    .match-card h4 { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .vs { font-size: 19px; font-weight: 800; }
    .match-actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
    .btn { border: none; font-weight: 700; border-radius: 10px; padding: 11px 18px; cursor: pointer; font-size: 14px; }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.secondary { background: var(--accent2); color: #fff; }
    .btn.sell { background: #b3302f; color: #fff; padding: 8px 12px; font-size: 12px; }
    .btn.buy { background: var(--accent); color: #fff; padding: 8px 12px; font-size: 12px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    .player-list { display: flex; flex-direction: column; gap: 8px; }
    .player { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
    .rating-badge { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0; }
    .player .info { flex: 1; min-width: 0; }
    .player .name { font-weight: 700; font-size: 14px; }
    .player .meta { color: var(--muted); font-size: 11px; }
    .pos-tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; font-weight: 700; }
    .overall { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    td.num { text-align: center; }
    tr.me-row { background: rgba(46,160,67,.1); }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    .season-done { text-align: center; padding: 24px 10px; }
    .bracket { display: flex; flex-direction: column; gap: 6px; }
    .bracket .tie { display: flex; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
    .bracket .winner { color: #3fb950; font-weight: 700; }
    .section-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 8px; }

    /* setup */
    #setup { position: absolute; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; text-align: center; }
    .panel h2 { margin-bottom: 4px; }
    .panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .panel input { width: 100%; background: #0b0f14; border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 16px; margin-bottom: 14px; }
    .colors { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-bottom: 18px; }
    .swatch { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
    .swatch.sel { border-color: #fff; transform: scale(1.1); }

    /* modal personalizar */
    #customModal { position: absolute; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
    #customModal .panel { text-align: left; }
    #customModal h2 { text-align: center; }
    #customModal label { font-size: 12px; color: var(--muted); display: block; margin: 10px 0 4px; }
    #customModal input { width: 100%; background: #0b0f14; border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 11px 13px; font-size: 15px; margin-bottom: 0; }
    #customModal .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    #customModal .modal-actions .btn { flex: 1; }

    /* polish estilo FC Mobile */
    body { background: radial-gradient(130% 100% at 50% 0%, #143150 0%, #0a1a2a 55%, #071018 100%); }
    #app { background: transparent; border-color: rgba(255,255,255,0.06); }
    .topbar-app { background: rgba(14,26,38,.9); }
    .navbar { background: rgba(14,26,38,.95); }
    .btn { background-image: linear-gradient(180deg, #2ea043, #1f7a33); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
    .btn.secondary { background-image: linear-gradient(180deg, #2f81f7, #1f5fc4); }
    .btn.sell { background-image: linear-gradient(180deg, #d14b3f, #a82d22); }
    .btn.buy { background-image: linear-gradient(180deg, #2ea043, #1f7a33); }
    .play-big {
      display: block; width: 100%; margin-top: 14px;
      font-size: 20px; font-weight: 900; letter-spacing: 1px;
      padding: 16px; border: none; border-radius: 14px; cursor: pointer;
      color: #fff; background-image: linear-gradient(180deg, #3fb950, #238636);
      box-shadow: 0 6px 22px rgba(63,185,80,.4);
    }
    .overall-card { background: linear-gradient(160deg, #1b2c3e, #101c2a); }
    #ballbg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #app { z-index: 1; }
  </style>
</head>
<body>
  <canvas id="ballbg" aria-hidden="true"></canvas>
  <div id="app">
    <div id="setup">
      <div class="panel">
        <h2>🏆 Creá tu club</h2>
        <div class="sub">Nombre y color. Arrancás con plantel, $60M, 500 monedas y 10 gemas.</div>
        <input id="clubName" placeholder="Nombre del club" maxlength="20" autocomplete="off">
        <div id="colors" class="colors"></div>
        <button class="btn primary" id="btnCreate" style="width:100%">Crear club</button>
      </div>
    </div>

    <div id="dash" style="display:none; flex-direction:column; flex:1">
      <div class="topbar-app">
        <div class="badge" id="badge">F</div>
        <div class="clubbox">
          <div id="clubTitle">Mi Club</div>
          <div class="level-row">
            <span class="level-tag">NV <span id="level">1</span></span>
            <div class="xp-bar"><span class="xp-fill" id="xpFill" style="width:0%"></span></div>
          </div>
        </div>
        <div class="currency">🪙 <span id="coins">0</span></div>
        <div class="currency">💎 <span id="gems">0</span></div>
        <button class="gear" id="btnSettings" title="Personalizar">⚙️</button>
      </div>

      <div id="content"></div>

      <nav class="navbar">
        <button data-tab="home" class="active"><span class="ic">🏠</span>Inicio</button>
        <button data-tab="team"><span class="ic">👥</span>Equipo</button>
        <button data-tab="market"><span class="ic">🛒</span>Mercado</button>
        <button data-tab="league"><span class="ic">🏆</span>Liga</button>
        <button data-tab="cup"><span class="ic">🥇</span>Copa</button>
      </nav>
    </div>

    <div id="customModal" style="display:none">
      <div class="panel">
        <h2>⚙️ Personalizar</h2>
        <label>Nombre del club</label>
        <input id="cClubName" maxlength="20" autocomplete="off">
        <label>Color del club</label>
        <div id="cColors" class="colors"></div>
        <label>Tu jugador (nombre)</label>
        <input id="cPlayerName" maxlength="20" autocomplete="off">
        <label>Número de camiseta</label>
        <input id="cPlayerNumber" type="number" min="1" max="99">
        <div class="modal-actions">
          <button class="btn primary" id="btnSaveCustom">Guardar</button>
          <button class="btn secondary" id="btnCloseCustom">Cerrar</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/career.js"></script>
  <script src="/ball.js"></script>
</body>
</html>
