<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAFO · Modo Carrera</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .spacer { flex: 1; }
    .back { color: var(--muted); text-decoration: none; font-size: 14px; }
    .back:hover { color: var(--text); }

    .panel { max-width: 460px; margin: 40px auto; }
    .panel input {
      width: 100%; background: #0b0f14; border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 13px 16px;
      font-size: 16px; margin: 12px 0;
    }
    .colors { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 18px; justify-content: center; }
    .swatch { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
    .swatch.sel { border-color: #fff; transform: scale(1.1); }

    .club-header { display: flex; align-items: center; gap: 16px; margin: 24px 0 8px; }
    .badge {
      width: 64px; height: 64px; border-radius: 14px; display: flex;
      align-items: center; justify-content: center; font-size: 32px; font-weight: 900;
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5);
    }
    .club-header h1 { font-size: 26px; }
    .budget { margin-left: auto; font-weight: 700; font-size: 18px; }

    .tabs { display: flex; gap: 8px; margin: 16px 0; border-bottom: 1px solid var(--border); }
    .tabs button {
      background: none; border: none; color: var(--muted); font-size: 15px;
      font-weight: 700; padding: 10px 16px; cursor: pointer; border-bottom: 3px solid transparent;
    }
    .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

    .player-list { display: flex; flex-direction: column; gap: 8px; }
    .player {
      display: flex; align-items: center; gap: 12px; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
    }
    .rating-badge {
      width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-weight: 800; font-size: 15px; flex-shrink: 0;
    }
    .player .info { flex: 1; }
    .player .name { font-weight: 700; }
    .player .meta { color: var(--muted); font-size: 12px; }
    .pos-tag { font-size: 11px; padding: 1px 7px; border-radius: 8px; font-weight: 700; }
    .btn.small { width: auto; padding: 8px 14px; font-size: 13px; margin: 0; }
    .btn.buy { background: var(--accent); }
    .btn.sell { background: #b3302f; }

    .match-card {
      background: var(--card); border: 1px solid var(--accent); border-radius: 14px;
      padding: 24px; text-align: center; margin-bottom: 20px;
    }
    .match-card h3 { margin-bottom: 4px; }
    .vs { font-size: 22px; font-weight: 800; margin: 12px 0; }
    .match-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    td.num { text-align: center; }
    tr.me-row { background: rgba(46,160,67,.1); }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .overall { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .season-done { text-align: center; padding: 30px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">🏆 FAFO Carrera</div>
    <div class="spacer"></div>
    <a class="back" href="/">← Portal</a>
  </header>

  <!-- Crear club -->
  <main id="setup" class="wrap">
    <div class="panel">
      <h2>Creá tu club</h2>
      <div class="sub">Elegí nombre y color. Empezás con un plantel y $60M de presupuesto.</div>
      <input id="clubName" placeholder="Nombre del club" maxlength="20" autocomplete="off">
      <div id="colors" class="colors"></div>
      <button class="btn primary" id="btnCreate" style="width:100%">Crear club</button>
    </div>
  </main>

  <!-- Dashboard -->
  <main id="dash" class="wrap" style="display:none">
    <div class="club-header">
      <div class="badge" id="badge">F</div>
      <div>
        <h1 id="clubTitle">Mi Club</h1>
        <div id="clubInfo" class="sub"></div>
      </div>
      <div class="budget">💰 $<span id="budget">0</span>M</div>
    </div>

    <nav class="tabs">
      <button data-tab="team" class="active">MI EQUIPO</button>
      <button data-tab="market">MARKET</button>
      <button data-tab="league">LEAGUE</button>
    </nav>

    <section id="tab-team"></section>
    <section id="tab-market" style="display:none"></section>
    <section id="tab-league" style="display:none"></section>
  </main>

  <script src="/career.js"></script>
</body>
</html>
