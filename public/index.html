<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAFO · Juegos online multijugador</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">⚽ FAFO</div>
    <div class="tagline">Jugá online con amigos</div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>FAFO <span class="badge">FÚTBOL</span></h1>
      <p>El juego principal. 1v1 en vivo contra un amigo, o 2 jugadores en la misma compu.</p>
      <a class="btn-play" href="/game/fafo.html">▶ Jugar ahora</a>
    </section>

    <section class="grid">
      <div class="card featured">
        <div class="thumb">⚽</div>
        <div class="meta">
          <h3>FAFO Fútbol</h3>
          <span class="tag live">Disponible · online</span>
        </div>
      </div>
      <div class="card">
        <div class="thumb">🎱</div>
        <div class="meta">
          <h3>8-Ball Pool</h3>
          <span class="tag soon">Próximamente</span>
        </div>
      </div>
      <div class="card">
        <div class="thumb">♟️</div>
        <div class="meta">
          <h3>Ajedrez</h3>
          <span class="tag soon">Próximamente</span>
        </div>
      </div>
      <div class="card">
        <div class="thumb">🃏</div>
        <div class="meta">
          <h3>Truco</h3>
          <span class="tag soon">Próximamente</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">FAFO · hecho con ❤️ · multijugador online</footer>
</body>
</html>
